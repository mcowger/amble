<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Amble — Paseo Web UI</title>
  <desc id="desc">Modern web workbench and client for the Paseo coding agent daemon.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181816"/>
      <stop offset="100%" stop-color="#121210"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242420"/>
      <stop offset="100%" stop-color="#1c1c19"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas with Warm Night palette -->
  <rect width="1200" height="340" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="24" fill="none" stroke="#2e2e28" stroke-width="2"/>

  <!-- Left: Brand and Architecture Identity -->
  <g transform="translate(64, 48)">
    <!-- Context Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="30" rx="15" fill="#242420" stroke="#383832" stroke-width="1"/>
      <circle cx="16" cy="15" r="4.5" fill="#10b981"/>
      <text x="30" y="19.5" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1">PASEO DAEMON CLIENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="96" fill="#fdfcfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Amble
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="136" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3">
      Multi-Session Agent Orchestration &amp; Web Workbench
    </text>

    <text x="0" y="168" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Interactive terminals, live git changes, real-time token telemetry,
    </text>
    <text x="0" y="192" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      and dual-mode summary visualization for autonomous coding agents.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 224)">
      <!-- Native Bun -->
      <g transform="translate(0, 0)">
        <rect width="112" height="26" rx="6" fill="#242420" stroke="#33332d" stroke-width="1"/>
        <text x="56" y="17" fill="#e5e5df" font-family="ui-monospace, monospace" font-size="11" font-weight="500" text-anchor="middle">Bun Native</text>
      </g>
      <!-- React 19 -->
      <g transform="translate(122, 0)">
        <rect width="96" height="26" rx="6" fill="#242420" stroke="#33332d" stroke-width="1"/>
        <text x="48" y="17" fill="#e5e5df" font-family="ui-monospace, monospace" font-size="11" font-weight="500" text-anchor="middle">React 19</text>
      </g>
      <!-- Summary Mode -->
      <g transform="translate(228, 0)">
        <rect width="138" height="26" rx="6" fill="#292318" stroke="#78350f" stroke-width="1"/>
        <text x="69" y="17" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">★ Summary Mode</text>
      </g>
      <!-- Warm Night / Warm Paper -->
      <g transform="translate(376, 0)">
        <rect width="144" height="26" rx="6" fill="#242420" stroke="#33332d" stroke-width="1"/>
        <text x="72" y="17" fill="#e5e5df" font-family="ui-monospace, monospace" font-size="11" font-weight="500" text-anchor="middle">Warm Design System</text>
      </g>
    </g>
  </g>

  <!-- Right: Live Workbench Interactive Preview Card -->
  <g transform="translate(680, 36)" filter="url(#subtleGlow)">
    <!-- Main Shell Card -->
    <rect width="456" height="268" rx="16" fill="url(#cardGrad)" stroke="#383832" stroke-width="1.5"/>

    <!-- Window Top Rail -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 440 0 C 448.84 0 456 7.16 456 16 L 456 40 L 0 40 Z" fill="#1e1e1b"/>
    <line x1="0" y1="40" x2="456" y2="40" stroke="#2e2e28" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="22" cy="20" r="4.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="38" cy="20" r="4.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="54" cy="20" r="4.5" fill="#10b981" opacity="0.8"/>

    <!-- Window Header Title -->
    <text x="74" y="24" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11" font-weight="500">amble &gt; session://active</text>

    <!-- Header Status Pill -->
    <rect x="364" y="11" width="76" height="18" rx="9" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
    <circle cx="374" cy="20" r="3" fill="#34d399"/>
    <text x="382" y="23" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="9" font-weight="600">CONNECTED</text>

    <!-- Interior: Dual-Card Summary Showcase -->
    <g transform="translate(16, 52)">
      <!-- Left: Tools Card -->
      <rect width="190" height="136" rx="10" fill="#181816" stroke="#2e2e28" stroke-width="1"/>
      <!-- Header -->
      <text x="14" y="24" fill="#fdfcfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Tools</text>
      <text x="176" y="24" fill="#78716c" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">12 calls</text>
      <line x1="12" y1="34" x2="178" y2="34" stroke="#242420" stroke-width="1"/>

      <!-- Tool Items -->
      <g transform="translate(14, 46)">
        <text x="0" y="12" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">read:</text>
        <text x="162" y="12" fill="#fdfcfa" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="end">6x</text>

        <text x="0" y="32" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11">bash:</text>
        <text x="162" y="32" fill="#fdfcfa" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="end">3x</text>

        <text x="0" y="52" fill="#60a5fa" font-family="ui-monospace, monospace" font-size="11">edit:</text>
        <text x="162" y="52" fill="#fdfcfa" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="end">2x</text>

        <text x="0" y="72" fill="#c084fc" font-family="ui-monospace, monospace" font-size="11">grep:</text>
        <text x="162" y="72" fill="#fdfcfa" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="end">1x</text>
      </g>

      <!-- Right: Thought Log Card -->
      <rect x="202" y="0" width="222" height="136" rx="10" fill="#181816" stroke="#2e2e28" stroke-width="1"/>
      <text x="216" y="24" fill="#fdfcfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Thought Log</text>
      <circle cx="408" cy="20" r="3" fill="#3b82f6"/>
      <line x1="214" y1="34" x2="412" y2="34" stroke="#242420" stroke-width="1"/>

      <!-- Thought Log Content Preview -->
      <g transform="translate(216, 48)">
        <text x="0" y="12" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="10" font-weight="600">◆ Integrating Markdown</text>
        <text x="0" y="30" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Integrated MarkdownRenderer into</text>
        <text x="0" y="46" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">SummaryTurnCard. Streaming tool</text>
        <text x="0" y="62" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">events verified cleanly with zero errors.</text>
      </g>
    </g>

    <!-- Bottom Mini-Composer -->
    <g transform="translate(16, 200)">
      <rect width="424" height="48" rx="10" fill="#181816" stroke="#2e2e28" stroke-width="1"/>
      <text x="14" y="28" fill="#57534e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Message active agent... (Enter to Steer, ⌘↵ to Interrupt)</text>

      <!-- Action Button -->
      <circle cx="398" cy="24" r="12" fill="#ef4444" opacity="0.2"/>
      <circle cx="398" cy="24" r="6" fill="#ef4444"/>
    </g>
  </g>
</svg>
