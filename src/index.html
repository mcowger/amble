<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>Amble — Paseo Web UI</title>

    <!-- Immediate theme initialization to eliminate flash of unstyled content (FOUC) on load -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("amble-theme");
          var dark =
            t === "dark" ||
            (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.backgroundColor = "#181816";
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.backgroundColor = "#fdfcfa";
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();

      // Prevent iOS gesture auto-zoom / pinch zoom to lock fixed viewport
      document.addEventListener("gesturestart", function (e) {
        e.preventDefault();
      });

      // Safe guard for injected Web3/Brave Wallet extension scripts on non-HTTPS origins
      if (typeof window !== "undefined" && !window.ethereum) {
        try {
          window.ethereum = { selectedAddress: undefined };
        } catch (e) {}
      }

      // Suppress cross-origin and third-party injected browser extension errors from triggering Bun's overlay
      window.addEventListener(
        "error",
        function (event) {
          var msg = event && event.message ? String(event.message) : "";
          if (
            msg === "Script error." ||
            msg.indexOf("ethereum") !== -1 ||
            msg.indexOf("selectedAddress") !== -1 ||
            (event.filename &&
              event.filename.indexOf(window.location.host) === -1 &&
              event.filename.indexOf("127.0.0.1") === -1 &&
              event.filename.indexOf("localhost") === -1)
          ) {
            event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        },
        true,
      );
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        overflow-y: hidden;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        height: 100%;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
      }
      html.dark, html.dark body {
        background-color: #181816 !important;
        color: #e5e5df !important;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #fdfcfa !important;
        color: #393a34 !important;
      }

      /* Prevent iOS Safari automatic zoom on focus by ensuring >= 16px font size on touch devices */
      input, textarea, select {
        font-size: 16px !important;
        touch-action: manipulation;
      }
      @media (min-width: 640px) {
        input, textarea, select {
          font-size: 14px !important;
        }
      }
    </style>

    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
